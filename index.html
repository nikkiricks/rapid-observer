<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Rapid Observer — Crisis Mapping Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root {
  --bg: #1a1814;
  --paint: #0f0d0a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg);
  font-family: 'Instrument Sans', system-ui, sans-serif;
  color: #f5efe6;
}
@keyframes ro-pulse {
  0%   { box-shadow: 0 0 0 0 currentColor; opacity: 0.7; }
  70%  { box-shadow: 0 0 0 12px transparent; opacity: 0; }
  100% { box-shadow: 0 0 0 0 transparent; opacity: 0; }
}
@keyframes ro-spin { to { transform: rotate(360deg); } }

.stage {
  position: fixed; inset: 0;
  display: flex; align-items: stretch;
  background:
    radial-gradient(1200px 800px at 50% 30%, #2a2520 0%, #1a1814 60%, #0f0d0a 100%);
}

/* Phone frame */
.phone-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 40px; min-width: 0; position: relative;
}
.phone {
  width: 390px; height: 820px;
  background: #000; border-radius: 56px;
  padding: 12px;
  box-shadow:
    0 0 0 2px #2a251f,
    0 60px 80px -20px rgba(0,0,0,0.6),
    0 30px 40px -10px rgba(0,0,0,0.4);
  position: relative;
  flex-shrink: 0;
}
.phone-screen {
  width: 100%; height: 100%; border-radius: 44px;
  overflow: hidden; background: #f5efe6;
  position: relative;
}
.phone-notch {
  position: absolute; top: 14px; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 32px;
  background: #000; border-radius: 20px;
  z-index: 100; pointer-events: none;
}
.phone-home-indicator {
  position: absolute; bottom: 8px; left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px;
  background: rgba(0,0,0,0.4);
  z-index: 100; pointer-events: none;
}

/* leaflet niceties */
.leaflet-container { font-family: inherit !important; }
.leaflet-pane.leaflet-tile-pane { filter: saturate(0.85) brightness(1.02); }

/* react */
#tweaks-root, #app-root { width: 100%; height: 100%; display: flex; }
</style>
</head>
<body>

<div class="stage">
  <div class="phone-area">
    <div class="phone">
      <div class="phone-screen">
        <div id="app-root"></div>
        <div class="phone-notch"></div>
        <div class="phone-home-indicator"></div>
      </div>
    </div>
  </div>
</div>

<div id="tweaks-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSelect } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dusk"
}/*EDITMODE-END*/;

function Shell() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // expose to App
  React.useEffect(() => { window.tw = tw; if (window.__rerender) window.__rerender(); }, [tw]);
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Theme">
        <TweakRadio
          label="Color"
          value={tw.theme}
          onChange={(v) => setTweak('theme', v)}
          options={[
            { value: 'clay',  label: 'Clay' },
            { value: 'sage',  label: 'Sage' },
            { value: 'dusk',  label: 'Dusk' },
            { value: 'ember', label: 'Ember' },
          ]}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<Shell />);

// Re-render the app whenever tw changes
function mountApp() {
  const root = ReactDOM.createRoot(document.getElementById('app-root'));
  function rerender() { root.render(<window.RapidObserverApp />); }
  window.__rerender = rerender;
  rerender();
}
// Wait for app.jsx to load (Babel processes scripts in order, so by now window.RapidObserverApp should exist)
if (window.RapidObserverApp) {
  mountApp();
} else {
  // Fallback: poll briefly
  let tries = 0;
  const id = setInterval(() => {
    if (window.RapidObserverApp || tries++ > 50) {
      clearInterval(id);
      if (window.RapidObserverApp) mountApp();
    }
  }, 50);
}
</script>

</body>
</html>
